<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Teras</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="page-header">
        <h1>Detail Teras Depan</h1>
        <a href="../index.html">Kembali</a>
    </header>

    <main class="layout">
        <div class="map-panel">
            <img class="terrace-image" src="../images/teras.png" usemap="#image-map" alt="Denah teras">
            <map name="image-map">
                <area alt="Teras" title="Teras" href="#teras" coords="99,1,99,478,4,481,0,3" shape="poly">
            </map>
        </div>

        <section class="details">
            <h2>Fasilitas</h2>
            <p>Pilih gambar teras untuk melihat keterangannya.</p>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Nama</th>
                            <th>Keterangan</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr id="teras">
                            <td>Teras</td>
                            <td>Area berpaving yang dapat digunakan sebagai halaman atau jalur akses rumah.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
