<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f5ef">
    <title>Profil | Denah Rumah</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="page-header">
        <h1>Profil Pengunjung</h1>
        <a href="index.html">← Kembali ke Beranda</a>
    </header>

    <main class="layout profile-layout">
        <section class="profile-card" aria-labelledby="profile-title">
            <!--h2 id="profile-title">Ceritakan tentang dirimu</!--h2>
            <p class="intro">Isi formulir berikut untuk melengkapi profil pengunjung.</p> -->

            <form class="profile-form" action="index.html" method="post">
                <div class="form-field">
                    <label for="name">Nama</label>
                    <input type="text" id="name" name="name" autocomplete="name" required>
                </div>

                <div class="form-field">
                    <label for="birth-date">Tanggal lahir</label>
                    <input type="date" id="birth-date" name="birth-date" required>
                </div>

                <fieldset class="form-field form-field-full gender-group">
                    <legend>Jenis kelamin</legend>
                    <label class="gender-option" for="male">
                        <input type="radio" id="male" name="gender" value="male" required>
                        Laki-laki
                    </label>
                    <label class="gender-option" for="female">
                        <input type="radio" id="female" name="gender" value="female">
                        Perempuan
                    </label>
                    <label class="gender-option" for="other">
                        <input type="radio" id="other" name="gender" value="other">
                        Lainnya
                    </label>
                </fieldset>

                <div class="form-field form-field-full">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>

                <div class="form-field form-field-full">
                    <label for="bio">Tentang saya</label>
                    <textarea id="bio" name="bio" rows="4" placeholder="Tuliskan sedikit tentang dirimu..."></textarea>
                </div>

                <button class="submit-button form-field-full" type="submit">Simpan Profil</button>
            </form>
        </section>
    </main>
</body>
</html>
